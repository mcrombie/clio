[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "clio"
version = "0.1.0"
description = "A reproducible, map-driven historical simulation engine."
readme = "B0_project_brief.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2,<3",
]

[project.scripts]
clio-brief1 = "clio.harness:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
